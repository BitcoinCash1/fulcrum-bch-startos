name: Check Upstream

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new upstream Fulcrum release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo cculianu/Fulcrum --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT="v$(sed -nE "s/^[[:space:]]*version:[[:space:]]*'([^:']+):.*/\1/p" startos/versions/current.ts | head -1)"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $LATEST — no update"
            exit 0
          fi


          echo "Updating $CURRENT -> $LATEST"
          BEFORE=$(git rev-parse HEAD)
          bash scripts/auto-bump.sh "$LATEST"
          # GITHUB_TOKEN pushes do not start Tag and Release.
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then gh workflow run tagAndRelease.yml; fi
        shell: bash
